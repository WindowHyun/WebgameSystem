<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>모여서 게임</title>
  <link rel="stylesheet" href="portal.css?v=6">
  <link rel="stylesheet" href="responsive-fixes.css?v=6">
</head>
<body class="portal-page">
  <div class="portal-shell">
    <nav class="portal-top" aria-label="서비스 정보">
      <span class="brand-mark">◆</span><b>모여서 게임</b>
      <span class="connection"><i></i> 실시간 연결</span>
    </nav>

    <main>
      <section id="name-screen" class="name-screen">
        <div class="name-copy">
          <p class="eyebrow">모여서 게임 워크스페이스</p>
          <h1>어떤 이름으로<br>참여할까요?</h1>
          <p class="description">게임에서 사용할 닉네임을 입력하세요. 로그인이나 가입은 필요하지 않습니다.</p>
          <form id="name-form">
            <label for="nickname">닉네임</label>
            <input id="nickname" maxlength="24" autocomplete="off" placeholder="예: 게임왕" required>
            <button>게임 채널로 이동</button>
          </form>
          <p class="join-footnote"><i></i> 입력한 이름은 이 브라우저에서만 사용됩니다.</p>
        </div>
      </section>

      <section id="games-screen" class="games-screen hidden">
        <header class="games-header">
          <div><p class="eyebrow">게임 채널</p><h1><span id="player-name"></span>님, 채널을 선택하세요</h1><p class="description">왼쪽 채널 목록에서 참가 인원과 진행 상태를 확인할 수 있습니다.</p><p class="touch-hint">폰 보스 키: 두 손가락으로 화면을 2초 동안 누르고 있으면 모두의 화면이 쇼핑몰 화면으로 가려집니다. 가려진 화면은 한 번 누르면 돌아옵니다.</p></div>
          <button id="rename" class="profile-button"><span id="profile-initial">나</span> 닉네임 변경</button>
        </header>
        <div class="games">
          <button class="game-card liar" data-url="liar.html"><span class="game-icon">🕵️</span><span class="game-copy"><b>라이어 게임</b><small>제시어를 숨긴 라이어를 찾아내는 대화 게임</small></span><span class="game-meta"><em id="liar-status">연결 중</em><i id="liar-count">0명</i></span></button>
          <button class="game-card poker" data-url="poker.html"><span class="game-icon">◎</span><span class="game-copy"><b>인디언 포커</b><small>상대의 카드만 보고 선택하는 심리전 카드 게임</small></span><span class="game-meta"><em id="poker-status">연결 중</em><i id="poker-count">0명</i></span></button>
          <button class="game-card blackjack" data-url="blackjack.html"><span class="game-icon">21</span><span class="game-copy"><b>블랙잭 21</b><small>딜러 없이 플레이어끼리 21에 가까워지는 카드 게임</small></span><span class="game-meta"><em id="blackjack-status">연결 중</em><i id="blackjack-count">0명</i></span></button>
          <button class="game-card mind" data-url="mind.html"><span class="game-icon">∞</span><span class="game-copy"><b>더 마인드</b><small>말없이 감으로 작은 수부터 카드를 내는 협동 게임</small></span><span class="game-meta"><em id="mind-status">연결 중</em><i id="mind-count">0명</i></span></button>
        </div>
      </section>
    </main>
  </div>
  <script src="game-socket.js?v=2"></script>
  <script src="portal.js?v=9"></script>
  <script src="cover.js?v=10"></script>
</body>
</html>
