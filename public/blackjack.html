<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>블랙잭 21</title><link rel="stylesheet" href="poker.css?v=4"><link rel="stylesheet" href="blackjack.css?v=3"><link rel="stylesheet" href="responsive-fixes.css?v=6"></head>
<body class="blackjack-page">
  <div id="app">
    <header class="topbar"><a href="/" id="leave" class="back" aria-label="게임 선택으로 돌아가기">←</a><div><h1>블랙잭 21</h1><p id="phase">대기 중</p></div><div class="pot"><small>현재 팟</small><strong id="pot">0원</strong></div></header>
    <section class="players-panel"><div class="section-title"><b>참가자</b><small>최대 5명 · 대기 중 참가자를 선택해 기부</small></div><div id="players"></div></section>
    <main>
      <section id="table"><div class="round-info"><span id="base-label">기본 100원</span><span id="message">참가자들이 준비하면 시작할 수 있습니다.</span></div><div id="cards"></div></section>
      <section id="lobby" class="controls"><div class="bet-setting"><label for="base-bet">기본 배팅금 제안</label><input id="base-bet" type="number" min="100" step="100" value="100"><button id="set-bet" data-help="입력한 기본 배팅금으로 변경할지 참가자 투표를 요청합니다.">투표 요청</button></div><div class="main-actions"><button id="ready" class="secondary" data-help="게임 참가 준비 상태를 설정하거나 취소합니다.">준비</button><button id="start" data-help="준비를 마친 참가자들과 새 라운드를 시작합니다.">게임 시작</button></div></section>
      <section id="playing" class="controls hidden"><div class="phase-help">21을 초과해도 계속 뽑거나 스탠드할 수 있습니다.</div><div class="main-actions"><button id="stand" class="secondary" data-help="현재 패를 확정하고 카드 선택을 마칩니다.">스탠드</button><button id="hit" data-help="덱에서 카드를 한 장 더 받습니다. 21을 초과해도 계속 진행할 수 있습니다.">히트</button></div></section>
      <section id="betting" class="controls hidden"><button id="call" data-help="현재 배팅액에 맞춰 필요한 칩을 냅니다. 더 낼 것이 없으면 체크입니다.">콜</button><div class="raise-setting"><input id="raise-amount" aria-label="레이즈 금액" type="number" min="100" step="100" value="100"><button id="raise" class="secondary" data-help="현재 배팅액을 입력한 금액만큼 올립니다.">레이즈</button></div><button id="allin" class="warning" data-help="보유한 칩 전부를 배팅합니다. 상대가 받을 수 있는 금액까지만 걸리고, 이 판의 배팅 상한이 고정됩니다.">올인</button><button id="fold" class="text-button" data-help="이번 판을 포기하며 이미 낸 칩은 팟에 남습니다.">폴드</button></section>
      <p id="action-help" class="action-help">버튼에 마우스를 올리거나 선택하면 기능 설명이 표시됩니다.</p>
      <section id="history" aria-label="게임 기록"></section>
    </main>
  </div>
  <div id="proposal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-card"><small>기본 배팅금 변경 제안</small><h2 id="proposal-title"></h2><p id="proposal-count"></p><div><button id="proposal-no" class="secondary" data-help="제안된 기본 배팅금 변경에 반대합니다.">거절</button><button id="proposal-yes" data-help="제안된 기본 배팅금 변경에 찬성합니다.">동의</button></div></div></div>
  <div id="start-confirm" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="start-confirm-title"><div class="modal-card"><small>게임 시작</small><h2 id="start-confirm-title"></h2><p id="start-confirm-ready"></p><p id="start-confirm-waiting"></p><div><button id="start-cancel" class="secondary" data-help="시작하지 않고 돌아갑니다.">취소</button><button id="start-go" data-help="준비한 참가자들과 새 판을 시작합니다.">시작하기</button></div></div></div>
  <div id="donate" class="popover hidden"><b id="donate-name"></b><input id="donate-amount" aria-label="기부 금액" type="number" min="100" step="100" value="100"><button id="donate-send" data-help="입력한 칩을 선택한 참가자에게 무상으로 보냅니다.">기부하기</button></div>
  <div id="error" role="alert"></div><script src="game-socket.js?v=1"></script><script src="blackjack.js?v=14"></script><script src="mobile.js?v=3"></script><script src="cover.js?v=10"></script>
</body></html>
