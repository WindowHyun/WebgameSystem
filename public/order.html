<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>운영자 화면</title>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="order.css">
</head>
<body>
  <header class="top"><b>운영자 화면</b><span id="stamp" class="stamp"></span></header>
  <main>
    <section id="panel">
      <div class="summary">
        <div><small>접속 중인 참가자</small><b id="sum-online">0</b></div>
        <div><small>진행 중인 게임</small><b id="sum-running">0</b></div>
        <div><small>포털 대기</small><b id="sum-portal">0</b></div>
      </div>
      <p id="notice" class="notice" role="status"></p>
      <div id="games"></div>
    </section>
  </main>
  <script src="order.js"></script>
</body>
</html>
