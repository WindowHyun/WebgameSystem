<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Webgame System</title><link rel="stylesheet" href="portal.css"></head><body>
<main><section id="name-screen" class="panel"><p class="eyebrow">WEBGAME SYSTEM</p><h1>플레이어 이름을 정하세요</h1><p>모든 게임에서 사용할 닉네임입니다.</p><form id="name-form"><input id="nickname" maxlength="24" autocomplete="off" placeholder="닉네임" required><button>게임 선택</button></form></section>
<section id="games-screen" class="hidden"><header><div><p class="eyebrow">WELCOME</p><h1><span id="player-name"></span>님, 게임을 선택하세요</h1></div><button id="rename" class="ghost">닉네임 변경</button></header><div class="games">
<button class="game-card liar" data-url="liar.html"><span class="icon">🕵️</span><span><b>라이어 게임</b><small>제시어를 숨긴 라이어를 찾아내세요</small></span><em id="liar-status">연결 중</em><i id="liar-count">0명</i></button>
<button class="game-card poker" data-url="poker.html"><span class="icon">🂠</span><span><b>인디언 포커</b><small>상대의 카드만 보고 배팅하세요</small></span><em id="poker-status">연결 중</em><i id="poker-count">0명</i></button>
</div></section></main><script src="portal.js"></script></body></html>
